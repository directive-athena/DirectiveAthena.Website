<!DOCTYPE html>
<!--suppress HtmlUnknownTarget -->
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directive Athena</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="DirectiveAthena.Website.styles.css" rel="stylesheet" /> 
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <link rel="stylesheet" href="css/loader.css" />
        
        <div id="loading-screen" class="loading-container">
            <div class="stars-overlay"></div>
            <div class="loader-content">
                <div class="logo-wrapper">
                    <img src="assets/logo.svg" alt="Directive Athena Logo" class="loader-logo" />
                    <div class="logo-glow-ring"></div>
                </div>
                <div class="boot-sequence">
                    <div class="status-text">INITIALIZING DIRECTIVE ATHENA...</div>
                    <div class="scanline-container">
                        <div class="scanline-bar"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/interop.js"></script>
</body>

</html>
