<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <!-- Background Gradient -->
        <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#111827"/>
            <stop offset="100%" stop-color="#0A0E1C"/>
        </radialGradient>

        <!-- Nebula Gradients -->
        <radialGradient id="nebulaMagenta" cx="30%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#802040" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#802040" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nebulaCyan" cx="75%" cy="30%" r="45%">
            <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="nebulaPurple" cx="60%" cy="70%" r="45%">
            <stop offset="0%" stop-color="#802080" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#802080" stop-opacity="0"/>
        </radialGradient>

        <!-- Moon Gradient -->
        <linearGradient id="moonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1e293b"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </linearGradient>

        <!-- Glow Halo Gradient -->
        <radialGradient id="haloGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
            <stop offset="70%" stop-color="#802040" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#0A0E1C" stop-opacity="0"/>
        </radialGradient>

        <!-- Glow Filter -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>

        <filter id="haloBlur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="40"/>
        </filter>

        <!-- Logo Gradients (Extracted from logo-color.svg) -->
        <linearGradient id="logo-silver" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#d9d9d9"/>
        </linearGradient>
        <linearGradient id="logo-depth" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#9e9e9e"/>
        </linearGradient>
        <linearGradient id="logo-accent" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#060040"/>
        </linearGradient>

        <style>
            .cls-1 {
            fill: url(#linear-gradient-2);
            }

            .cls-2 {
            fill: url(#linear-gradient-10);
            }

            .cls-3 {
            fill: #fff;
            }

            .cls-4 {
            fill: url(#linear-gradient-4);
            }

            .cls-4, .cls-5, .cls-6, .cls-7, .cls-8, .cls-9 {
            mix-blend-mode: multiply;
            }

            .cls-5 {
            opacity: .4;
            }

            .cls-10 {
            isolation: isolate;
            }

            .cls-11 {
            fill: url(#linear-gradient-8);
            }

            .cls-6 {
            fill: url(#linear-gradient-5);
            }

            .cls-12 {
            fill: url(#linear-gradient-9);
            }

            .cls-13 {
            fill: url(#linear-gradient-11);
            }

            .cls-7 {
            fill: url(#linear-gradient-3);
            }

            .cls-14 {
            fill: #7a0035;
            }

            .cls-15 {
            fill: url(#linear-gradient);
            }

            .cls-8 {
            fill: url(#linear-gradient-6);
            }

            .cls-9 {
            fill: url(#linear-gradient-7);
            }
        </style>
        <linearGradient id="linear-gradient" x1="460.88" y1="480.62" x2="860.88" y2="880.62"
                        gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#d9d9d9"/>
        </linearGradient>
        <linearGradient id="linear-gradient-2" x1="563.12" y1="480.62" x2="163.12" y2="880.62"
                        gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff"/>
            <stop offset="1" stop-color="#d9d9d9"/>
        </linearGradient>
        <linearGradient id="linear-gradient-3" x1="512" y1="459.5" x2="512" y2="714.5" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset="1" stop-color="#9e9e9e"/>
        </linearGradient>
        <linearGradient id="linear-gradient-4" y1="714.5" y2="784.9" xlink:href="#linear-gradient-3"/>
        <linearGradient id="linear-gradient-5" y1="784.9" y2="864.5" xlink:href="#linear-gradient-3"/>
        <linearGradient id="linear-gradient-6" y1="159.5" y2="277" xlink:href="#linear-gradient-3"/>
        <linearGradient id="linear-gradient-7" y1="249.5" y2="497.18" xlink:href="#linear-gradient-3"/>
        <linearGradient id="linear-gradient-8" x1="727" y1="364.5" x2="727" y2="864.5" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#fff" stop-opacity="0"/>
            <stop offset=".49" stop-color="#f7f7f9" stop-opacity=".03"/>
            <stop offset=".67" stop-color="#dddce5" stop-opacity=".14"/>
            <stop offset=".8" stop-color="#afadc1" stop-opacity=".32"/>
            <stop offset=".9" stop-color="#6d6a8f" stop-opacity=".58"/>
            <stop offset=".98" stop-color="#19134e" stop-opacity=".92"/>
            <stop offset="1" stop-color="#060040"/>
        </linearGradient>
        <linearGradient id="linear-gradient-9" x1="297" x2="297" xlink:href="#linear-gradient-8"/>
        <linearGradient id="linear-gradient-10" x1="352" y1="319.12" x2="352" y2="710.27"
                        xlink:href="#linear-gradient-8"/>
        <linearGradient id="linear-gradient-11" x1="672" y1="319.12" x2="672" y2="710.27"
                        xlink:href="#linear-gradient-8"/>
    </defs>

    <!-- 1. Background -->
    <rect width="1200" height="630" fill="url(#bgGradient)"/>

    <!-- 2. Nebula -->
    <rect width="1200" height="630" fill="url(#nebulaMagenta)" style="mix-blend-mode: screen;"/>
    <rect width="1200" height="630" fill="url(#nebulaCyan)" style="mix-blend-mode: screen;"/>
    <rect width="1200" height="630" fill="url(#nebulaPurple)" style="mix-blend-mode: screen;"/>

    <!-- 3. Stars (simplified representation) -->
    <g fill="white" opacity="0.6">
        <circle cx="100" cy="80" r="1"/>
        <circle cx="250" cy="150" r="1.5"/>
        <circle cx="400" cy="50" r="1"/>
        <circle cx="550" cy="120" r="0.8"/>
        <circle cx="700" cy="90" r="1.2"/>
        <circle cx="850" cy="160" r="1"/>
        <circle cx="1050" cy="70" r="1.5"/>
        <circle cx="150" cy="300" r="0.8"/>
        <circle cx="320" cy="250" r="1"/>
        <circle cx="900" cy="350" r="1.2"/>
        <circle cx="1100" cy="280" r="1"/>
        <circle cx="50" cy="500" r="1"/>
        <circle cx="1150" cy="550" r="1"/>
    </g>

    <!-- 4. Moon Horizon -->
    <g transform="translate(0, 480)">
        <path d="M0,150 Q600,-50 1200,150 L1200,150 L0,150 Z" fill="url(#moonGradient)" opacity="0.7"
              filter="url(#softGlow)"/>
    </g>

    <!-- 5. Logo Halo -->
    <circle cx="600" cy="280" r="220" fill="url(#haloGradient)" filter="haloBlur"/>

