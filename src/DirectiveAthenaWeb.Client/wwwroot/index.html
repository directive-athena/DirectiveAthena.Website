<!DOCTYPE html>
<!--suppress HtmlUnknownTarget -->
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Directive Athena</title>
    <meta name="description" content="A cosmic-themed portfolio and writing site dedicated to Directive Athena."/>
    <meta name="theme-color" content="#0A0E1C"/>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://directiveathena.com/"/>
    <meta property="og:title" content="Directive Athena"/>
    <meta property="og:description"
          content="A cosmic-themed portfolio and writing site dedicated to Directive Athena."/>
    <meta property="og:image" content="https://directiveathena.com/assets/social-preview.png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image"/>
    <meta property="twitter:url" content="https://directiveathena.com/"/>
    <meta property="twitter:title" content="Directive Athena"/>
    <meta property="twitter:description"
          content="A cosmic-themed portfolio and writing site dedicated to Directive Athena."/>
    <meta property="twitter:image" content="https://directiveathena.com/assets/social-preview.png"/>

    <base href="/"/>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico"/>
    <link rel="stylesheet" href="css/app.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet"/>
    <link href="DirectiveAthenaWeb.Client.styles.css" rel="stylesheet"/>
    <script type="importmap"></script>
</head>

<body>
<div id="app">
    <link rel="stylesheet" href="css/loader.css"/>

    <div id="loading-screen" class="loading-container">
        <div class="stars-overlay"></div>
        <div class="loader-content">
            <div class="logo-wrapper">
                <img src="assets/logo.svg" alt="Directive Athena Logo" class="loader-logo"/>
                <div class="logo-glow-ring"></div>
            </div>
            <div class="boot-sequence">
                <div class="status-text">INITIALIZING DIRECTIVE ATHENA...</div>
                <div class="scanline-container">
                    <div class="scanline-bar"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
</div>

<script src="_framework/blazor.webassembly.js"></script>
<script src="_content/MudBlazor/MudBlazor.min.js"></script>
<script src="js/interop.bundle.min.js"></script>
</body>

</html>
