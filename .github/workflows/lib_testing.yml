name: Run tests

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install npm dependencies
        run: npm ci
        working-directory: src/DirectiveAthena.Website.ClientAssets

      - name: Build interop bundle
        run: npm run build
        working-directory: src/DirectiveAthena.Website.ClientAssets

      - name: Run TypeScript unit tests
        run: npm run test:ts
        working-directory: src/DirectiveAthena.Website.ClientAssets

      - name: Restore dependencies
        run: dotnet restore DirectiveAthena.Website.slnx

      - name: Run tests
        run: dotnet test --solution DirectiveAthena.Website.slnx --configuration Release --no-restore
