name: Deploy to Github Pages

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
    run-tests:
        name: Run Multi-Platform Tests
        uses: ./.github/workflows/lib_testing.yml
        secrets: inherit
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.CORE_PUSH_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install npm dependencies
        run: npm ci
        working-directory: src/DirectiveAthena.Website.ClientAssets

      - name: Build interop bundle
        run: npm run build
        working-directory: src/DirectiveAthena.Website.ClientAssets

      - name: Run TypeScript unit tests
        run: npm run test:ts
        working-directory: src/DirectiveAthena.Website.ClientAssets

      - name: Restore dependencies
        run: dotnet restore DirectiveAthena.Website.slnx
      
      - name: Run tests
        run: dotnet test --solution DirectiveAthena.Website.slnx --configuration Release --no-restore

      - name: Bump site version
        id: version
        run: |
          version_file="src/DirectiveAthena.Website/wwwroot/version.txt"
          if [ ! -f "$version_file" ]; then
            echo "0.0.0" > "$version_file"
          fi
          current_version="$(cat "$version_file" | tr -d ' \n\r')"
          if ! [[ "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $current_version"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current_version"
          bump_type="${{ inputs.version_bump }}"
          case "$bump_type" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Invalid bump type: $bump_type"
              exit 1
              ;;
          esac
          new_version="$major.$minor.$patch"
          echo "$new_version" > "$version_file"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          CORE_PUSH_TOKEN: ${{ secrets.CORE_PUSH_TOKEN }}
        run: |
          if [ -z "$CORE_PUSH_TOKEN" ]; then
            echo "CORE_PUSH_TOKEN is not set."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/DirectiveAthena.Website/wwwroot/version.txt
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git remote set-url origin "https://x-access-token:${CORE_PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin HEAD
          git push origin --tags

      - name: Publish docs site
        run: |
          dotnet publish src/DirectiveAthena.Website -c Release -o ./out \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:DebuggerSupport=false \
            -p:MetadataUpdaterSupport=false
          cp ./out/wwwroot/index.html ./out/wwwroot/404.html
      
      - name: List published files
        # sanity check so you can see what will be uploaded (optional)
        run: |
          echo "Published output:"
          ls -la ./out

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './out/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          token: ${{ secrets.CORE_PUSH_TOKEN }}
