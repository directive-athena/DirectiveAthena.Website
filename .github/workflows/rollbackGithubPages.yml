name: Rollback Github Pages

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to deploy (e.g., v1.2.3)
                required: true
                type: string
            skip_tests:
                description: Skip tests (true/false)
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    run-tests:
        if: ${{ inputs.skip_tests != 'true' }}
        name: Run Multi-Platform Tests
        # noinspection UndefinedAction
        uses: ./.github/workflows/lib_testing.yml
        with:
            # noinspection UndefinedParamsPresent
            ref: ${{ inputs.tag }}
        secrets: inherit
    
    deploy:
        name: Deploy Tagged Version
        runs-on: ubuntu-latest
        needs: run-tests
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            -   name: Checkout tag
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0
                    ref: ${{ inputs.tag }}

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: '10.x'

            -   name: Setup Node
                uses: actions/setup-node@v6
                with:
                    node-version: '20.x'

            -   name: Install npm dependencies
                run: npm ci
                working-directory: src/DirectiveAthenaWeb.Services.Js

            -   name: Build interop bundle
                run: npm run build
                working-directory: src/DirectiveAthenaWeb.Services.Js

            -   name: Publish docs site
                run: |
                    dotnet publish src/DirectiveAthenaWeb.Client -c Release -o ./out \
                      -p:PublishTrimmed=true \
                      -p:TrimMode=partial \
                      -p:DebuggerSupport=false \
                      -p:MetadataUpdaterSupport=false
                    cp ./out/wwwroot/index.html ./out/wwwroot/404.html

            -   name: Setup Pages
                uses: actions/configure-pages@v6

            -   name: Upload artifact
                uses: actions/upload-pages-artifact@v4
                with:
                    path: ./out/wwwroot

            -   name: Deploy to GitHub Pages
                id: deployment
                uses: actions/deploy-pages@v4
